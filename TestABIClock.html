<!DOCTYPE html>
<html>
<head>
  <title>Student Hours App</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: auto; padding: 20px; }
    input, select { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { margin: 10px 5px 10px 0; padding: 10px 20px; }
    .progress { height: 20px; background: #eee; margin: 5px 0; }
    .bar { height: 100%; background: #4caf50; text-align: center; color: white; }
    .section { margin-top: 30px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Student Hours Tracker</h1>

  <div id="login-section" class="section">
    <label for="studentID">Student ID:</label>
    <input type="text" id="studentID" placeholder="Enter your Student ID" />
  </div>

  <div id="clock-section" class="section hidden">
    <h2>Clock In / Clock Out</h2>
    <button onclick="clockIn()">Clock In</button>
    <button onclick="clockOut()">Clock Out</button>
  </div>

  <div id="allocate-section" class="section hidden">
    <h2>Allocate Hours to Courses</h2>
    <label for="alloc-date">Date:</label>
    <input type="date" id="alloc-date" />

    <label for="alloc-course">Course:</label>
    <input type="text" id="alloc-course" placeholder="Course name" />

    <label for="alloc-hours">Hours to allocate:</label>
    <input type="number" id="alloc-hours" min="0" step="0.25" placeholder="e.g. 2.5" />

    <button onclick="allocateHours()">Allocate Hours</button>
  </div>

  <div id="progress-section" class="section hidden">
    <h2>Your Progress</h2>
    <button onclick="loadProgress()">View Progress</button>
    <div id="progress"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxrFNP-tO9kNUqVbSLaCJyKcgg_bks1Ysthb9MvfK97GAHheeka8o6Z6_zlKCZlxGD4/exec";

    // Utility to show sections
    function showSection(sectionId) {
      document.querySelectorAll('.section').forEach(sec => {
        sec.classList.add('hidden');
      });
      document.getElementById(sectionId).classList.remove('hidden');
    }

    // Login / validate student ID (could enhance this by checking from backend)
    function login() {
      const id = document.getElementById("studentID").value.trim();
      if (!id) {
        alert("Please enter your Student ID.");
        return;
      }
      // Optionally: fetch from API to verify the student exists
      showSection('clock-section');
      showSection('allocate-section');
      showSection('progress-section');
    }

    async function clockIn() {
      const id = document.getElementById("studentID").value.trim();
      if (!id) { alert("Enter your ID first."); return; }
      const response = await fetch(`${API_URL}?action=clockIn&studentID=${encodeURIComponent(id)}`);
      const data = await response.json();
      if (data.status === "OK") {
        alert("Clocked in successfully!");
      } else {
        alert("Error: " + data.message);
      }
    }

    async function clockOut() {
      const id = document.getElementById("studentID").value.trim();
      if (!id) { alert("Enter your ID first."); return; }
      const response = await fetch(`${API_URL}?action=clockOut&studentID=${encodeURIComponent(id)}`);
      const data = await response.json();
      if (data.status === "OK") {
        alert(`Clocked out. Worked ${data.hours.toFixed(2)} hours.`);
      } else {
        alert("Error: " + data.message);
      }
    }

    async function allocateHours() {
      const id = document.getElementById("studentID").value.trim();
      const date = document.getElementById("alloc-date").value;
      const course = document.getElementById("alloc-course").value.trim();
      const hours = parseFloat(document.getElementById("alloc-hours").value);

      if (!id || !date || !course || !hours || hours <= 0) {
        alert("Please fill all fields properly to allocate hours.");
        return;
      }

      const url = `${API_URL}?action=allocate&studentID=${encodeURIComponent(id)}&date=${encodeURIComponent(date)}&course=${encodeURIComponent(course)}&hours=${encodeURIComponent(hours)}`;

      const response = await fetch(url);
      const data = await response.json();
      if (data.status === "OK") {
        alert("Hours allocated successfully!");
      } else {
        alert("Error: " + data.message);
      }
    }

    async function loadProgress() {
      const id = document.getElementById("studentID").value.trim();
      if (!id) { alert("Enter your ID first."); return; }
      const response = await fetch(`${API_URL}?action=getProgress&studentID=${encodeURIComponent(id)}`);
      const data = await response.json();
      if (data.status !== "OK") {
        alert("Error: " + data.message);
        return;
      }
      const container = document.getElementById("progress");
      container.innerHTML = ""; // reset

      data.courses.forEach(c => {
        const pct = (c.progress > 100 ? 100 : c.progress).toFixed(1);
        container.innerHTML += `
          <div>
            <strong>${c.course}</strong>: ${c.completed.toFixed(2)} / ${c.required.toFixed(2)}
          </div>
          <div class="progress">
            <div class="bar" style="width:${pct}%">${pct}%</div>
          </div>
        `;
      });
    }

    // Optional: automatically show login, then other sections once student enters ID
    document.getElementById("studentID").addEventListener("change", login);
  </script>

</body>
</html>
