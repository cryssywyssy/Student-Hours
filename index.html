<!DOCTYPE html>
<html>
<head>
  <title>Student Hours Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: auto; padding: 20px; }
    input, select { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { margin: 10px 5px 10px 0; padding: 12px 30px; font-size: 1.2em; border-radius: 8px; border: none; cursor: pointer; }
    .clock-in { background-color: #4caf50; color: white; }
    .clock-out { background-color: #f44336; color: white; }
    .progress { height: 20px; background: #eee; margin: 5px 0; border-radius: 5px; }
    .bar { height: 100%; background: #4caf50; text-align: center; color: white; border-radius: 5px; }
    .section { margin-top: 30px; }
    .hidden { display: none; }
    #current-time { font-size: 2em; margin-bottom: 15px; text-align: center; }
    #clock-status { margin-top: 10px; font-size: 1.2em; text-align: center; }
  </style>
</head>
<body>
  <h1>Student Hours Tracker</h1>

  <!-- Login Section -->
  <div id="login-section" class="section">
    <label for="studentID">Student ID:</label>
    <input type="text" id="studentID" placeholder="Enter your Student ID" />
    <button onclick="login()">Login</button>
  </div>

  <!-- Clock Section -->
  <div id="clock-section" class="section hidden">
    <h2>Clock In / Clock Out</h2>
    <div id="current-time"></div>
    <button id="clock-in-btn" class="clock-in" onclick="clockIn()">Clock In</button>
    <button id="clock-out-btn" class="clock-out" onclick="clockOut()">Clock Out</button>
    <div id="clock-status"></div>
  </div>

  <!-- Allocate Hours Section -->
  <div id="allocate-section" class="section hidden">
    <h2>Allocate Hours to Courses</h2>
    <label for="alloc-date">Date:</label>
    <input type="date" id="alloc-date" />
    <label for="alloc-course">Course:</label>
    <input type="text" id="alloc-course" placeholder="Course name" />
    <label for="alloc-hours">Hours:</label>
    <input type="number" id="alloc-hours" min="0" step="0.25" placeholder="e.g. 2.5" />
    <button onclick="allocateHours()">Allocate Hours</button>
  </div>

  <!-- Progress Section -->
  <div id="progress-section" class="section hidden">
    <h2>Your Progress</h2>
    <button onclick="loadProgress()">View Progress</button>
    <div id="progress"></div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzMrd2217P5rEvVAVKaRhUIkYtqx8kDlrjvgpe8fZaedVwnkdHZK3I5pbQ4_5PMk94l/exec";
    let isClockedIn = false;

    // Live clock
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById("current-time").textContent = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Login function
    async function login() {
      const id = document.getElementById("studentID").value.trim();
      if (!id) { alert("Please enter your Student ID."); return; }

      // Reveal all sections
      document.getElementById('clock-section').classList.remove('hidden');
      document.getElementById('allocate-section').classList.remove('hidden');
      document.getElementById('progress-section').classList.remove('hidden');
      document.getElementById('studentID').disabled = true;

      // Fetch actual clocked-in status
      try {
        const res = await fetch(`${API_URL}?action=getStatus&studentID=${encodeURIComponent(id)}`);
        const data = await res.json();
        isClockedIn = data.isClockedIn;
        updateClockStatus();
      } catch (err) {
        alert("Error fetching clock status: " + err);
      }
    }

    function updateClockStatus() {
      const status = document.getElementById("clock-status");
      if (isClockedIn) {
        status.textContent = "✅ You are currently CLOCKED IN";
        document.getElementById("clock-in-btn").disabled = true;
        document.getElementById("clock-out-btn").disabled = false;
      } else {
        status.textContent = "❌ You are currently CLOCKED OUT";
        document.getElementById("clock-in-btn").disabled = false;
        document.getElementById("clock-out-btn").disabled = true;
      }
    }

    // Clock In / Clock Out
    async function clockIn() {
      const id = document.getElementById("studentID").value.trim();
      if (!id) { alert("Enter your ID first."); return; }
      try {
        const res = await fetch(`${API_URL}?action=clockIn&studentID=${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.status === "OK") { isClockedIn = true; updateClockStatus(); alert("Clocked in!"); }
        else alert("Error: " + data.message);
      } catch (err) { alert("Error: " + err); }
    }

    async function clockOut() {
      const id = document.getElementById("studentID").value.trim();
      if (!id) { alert("Enter your ID first."); return; }
      try {
        const res = await fetch(`${API_URL}?action=clockOut&studentID=${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.status === "OK") { 
          isClockedIn = false; 
          updateClockStatus(); 
          alert(`Clocked out. Worked ${data.hours.toFixed(2)} hours.`); 
        } else { alert("Error: " + data.message); }
      } catch (err) { alert("Error: " + err); }
    }

    // Allocate hours
    async function allocateHours() {
      const id = document.getElementById("studentID").value.trim();
      const date = document.getElementById("alloc-date").value;
      const course = document.getElementById("alloc-course").value.trim();
      const hours = parseFloat(document.getElementById("alloc-hours").value);
      if (!id || !date || !course || !hours || hours <= 0) {
        alert("Fill all fields correctly to allocate hours."); return;
      }
      try {
        const res = await fetch(`${API_URL}?action=allocate&studentID=${encodeURIComponent(id)}&date=${encodeURIComponent(date)}&course=${encodeURIComponent(course)}&hours=${encodeURIComponent(hours)}`);
        const data = await res.json();
        if (data.status === "OK") alert("Hours allocated successfully!");
        else alert("Error: " + data.message);
      } catch (err) { alert("Error: " + err); }
    }

    // Load progress
    async function loadProgress() {
      const id = document.getElementById("studentID").value.trim();
      if (!id) { alert("Enter your ID first."); return; }
      try {
        const res = await fetch(`${API_URL}?action=getProgress&studentID=${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.status !== "OK") { alert("Error: " + data.message); return; }
        const container = document.getElementById("progress");
        container.innerHTML = "";
        data.courses.forEach(c => {
          const pct = Math.min(c.progress, 100).toFixed(1);
          container.innerHTML += `
            <div><strong>${c.course}</strong>: ${c.completed.toFixed(2)} / ${c.required.toFixed(2)}</div>
            <div class="progress"><div class="bar" style="width:${pct}%">${pct}%</div></div>
          `;
        });
      } catch (err) { alert("Error: " + err); }
    }

    // Allow Enter key to login
    document.getElementById("studentID").addEventListener("keypress", function(event) {
      if (event.key === "Enter") login();
    });
  </script>
</body>
</html>
